spring:
  application:
    name: customer-support-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:workflow_hub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  auth:
    jwt:
      issuer: customer-support-hub
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    cookie:
      refresh-token-name: ${JWT_REFRESH_COOKIE_NAME:customer_support_refresh}
      secure: ${COOKIE_SECURE:false}
      domain: ${COOKIE_DOMAIN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8080
